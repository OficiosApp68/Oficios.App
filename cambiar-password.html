<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cambiar contrasena | OFICIOS APP</title>
    <meta name="description" content="Crear una nueva contrasena para OFICIOS APP." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=profile-contact-20260720a" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav-shell" aria-label="Navegacion principal">
        <a class="brand" href="index.html" aria-label="OFICIOS APP inicio">
          <span class="brand-mark">OA</span>
          <span class="brand-name">OFICIOS APP</span>
        </a>
        <div class="nav-actions profile-nav-actions">
          <a class="button ghost" href="login.html">Iniciar sesion</a>
          <a class="button primary" href="index.html">Volver al inicio</a>
        </div>
      </nav>
    </header>

    <main class="form-page-main">
      <section class="form-page-shell" aria-labelledby="update-password-title">
        <div class="form-intro">
          <span class="eyebrow">Nueva contrasena</span>
          <h1 id="update-password-title">Cambiar contrasena</h1>
          <p>
            Escribi una contrasena nueva. Esta pantalla funciona cuando llegas desde el
            enlace enviado por email.
          </p>
        </div>

        <form class="professional-form auth-form" data-update-password-form novalidate>
          <div class="form-field full">
            <label for="new-password">Nueva contrasena</label>
            <input
              id="new-password"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="Minimo 6 caracteres"
            />
          </div>

          <div class="form-field full">
            <label for="new-password-confirmation">Confirmar nueva contrasena</label>
            <input
              id="new-password-confirmation"
              name="passwordConfirmation"
              type="password"
              autocomplete="new-password"
              minlength="6"
              required
              placeholder="Repeti la nueva contrasena"
            />
          </div>

          <div class="form-actions">
            <button class="button primary large" type="submit">Guardar nueva contrasena</button>
            <a class="button secondary large" href="login.html">Volver a iniciar sesion</a>
          </div>

          <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span class="brand-mark">OA</span>
      <p>OFICIOS APP - Plataforma preparada para crecer por etapas.</p>
    </footer>

    <script src="js/config/supabase-config.js"></script>
    <script src="js/services/supabase-service.js?v=google-session-20260726a"></script>
    <script src="js/services/auth-service.js?v=google-session-20260726a"></script>
    <script src="js/pages/update-password-page.js"></script>
  </body>
</html>
